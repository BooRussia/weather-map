<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The app icon (owner, 2026-10-30): a sunrise over bars of color, on warm cream.
       ios/App/App/Assets.xcassets/AppIcon.appiconset and public/apple-touch-icon.png are renders of this. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbf5"/>
      <stop offset="1" stop-color="#ffe4d1"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="560" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb547" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffb547" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#ff7438"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="1" stop-color="#ff4f7b"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a7e"/>
      <stop offset="1" stop-color="#d04dff"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b65cff"/>
      <stop offset="1" stop-color="#6f63ff"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#c2410c" flood-opacity="0.22"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g transform="translate(0 -40)">
    <!-- Five rays, 36° apart. -->
    <g stroke="#ffb224" stroke-width="44" stroke-linecap="round">
      <line x1="512" y1="310" x2="512" y2="234"/>
      <line x1="335.7" y1="367.3" x2="291" y2="305.8"/>
      <line x1="688.3" y1="367.3" x2="733" y2="305.8"/>
      <line x1="226.7" y1="517.3" x2="154.4" y2="493.8"/>
      <line x1="797.3" y1="517.3" x2="869.6" y2="493.8"/>
    </g>
    <path d="M272 610A240 240 0 0 1 752 610Z" fill="url(#sun)" filter="url(#lift)"/>
    <!-- Its reflection: bars of color, warm to cool. -->
    <g filter="url(#lift)">
      <rect x="212" y="650" width="600" height="70" rx="35" fill="url(#b1)"/>
      <rect x="292" y="750" width="440" height="70" rx="35" fill="url(#b2)"/>
      <rect x="382" y="850" width="260" height="70" rx="35" fill="url(#b3)"/>
    </g>
  </g>
</svg>
