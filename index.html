<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Live wind and rain over a dark map." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Weather Map" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Weather Map</title>
  </head>
  <body>
    <div id="map" class="map"></div>
    <canvas id="wind-canvas" class="layer-canvas" aria-hidden="true"></canvas>
    <canvas id="fx-canvas" class="layer-canvas" aria-hidden="true"></canvas>

    <header class="hud">
      <button id="hud-readout" class="hud-readout" type="button">
        <span class="hud-place-row">
          <span id="hud-gps" class="hud-mark" hidden></span>
          <span id="hud-place" class="hud-place"></span>
          <span id="hud-chevron" class="hud-mark"></span>
        </span>
        <span id="hud-temp" class="hud-temp"></span>
        <span id="hud-cond" class="hud-cond"></span>
        <span id="hud-hilo" class="hud-hilo"></span>
      </button>
    </header>

    <div class="top-right">
      <button id="gear" class="gear" type="button" aria-label="Settings"></button>
      <button id="alert-tag" class="alert-tag" type="button" hidden><span id="alert-tag-text"></span></button>
    </div>

    <div class="bottom">
      <p id="note" class="note" role="status" aria-live="polite"></p>
      <div id="timeline" class="timeline">
        <div class="tl-row">
          <button id="tl-play" class="tl-play" type="button" aria-label="Play radar timeline" title="Play / pause (Space)"></button>
          <span class="tl-label">
            <span id="tl-time" class="tl-time">Now</span>
            <span id="tl-kind" class="tl-kind">Live radar</span>
          </span>
          <span id="radar-legend" class="radar-legend" role="img" aria-label="Radar intensity scale: blue and green light, yellow and orange moderate, red heavy" hidden>
            <span>Light</span><i id="radar-legend-bar"></i><span>Heavy</span>
          </span>
        </div>
        <input id="tl-range" class="tl-range" type="range" min="-24" max="0" step="1" value="0" aria-label="Radar time" title="Drag, or use ← → to step an hour" />
        <div id="tl-scale" class="tl-scale" aria-hidden="true"></div>
      </div>
      <nav class="layer-bar" aria-label="Map layers">
        <button class="layer-toggle" data-layer="wind" type="button" aria-label="Wind" title="Wind"></button>
        <button class="layer-toggle" data-layer="rain" type="button" aria-label="Rain" title="Rain"></button>
        <button class="layer-toggle" data-layer="thunder" type="button" aria-label="Thunder" title="Thunder"></button>
        <button class="layer-toggle" data-layer="clouds" type="button" aria-label="Clouds (live satellite)" title="Clouds"></button>
      </nav>
      <footer class="attribution">
        <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
        <span> · <a href="https://www.weather.gov/" target="_blank" rel="noopener">NWS</a></span>
        <span data-credit="iem" hidden> · <a href="https://mesonet.agron.iastate.edu/" target="_blank" rel="noopener">IEM</a></span>
        <span data-credit="goes" hidden> · <a href="https://nowcoast.noaa.gov/" target="_blank" rel="noopener">NOAA GOES</a></span>
        <span data-credit="esri" hidden> · <a href="https://www.esri.com/" target="_blank" rel="noopener">Esri, Vantor, Earthstar Geographics, GIS User Community</a></span>
        <span> · <a href="https://carto.com/attributions" target="_blank" rel="noopener">© CARTO</a></span>
        <span> · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a></span>
      </footer>
    </div>

    <aside id="side" class="side" aria-labelledby="side-title" hidden>
      <header class="sheet-head">
        <h2 id="side-title" class="sheet-title"></h2>
        <button id="side-close" class="sheet-close" type="button" aria-label="Close details"></button>
      </header>
      <div id="side-body" class="sheet-body"></div>
    </aside>

    <div id="scrim" class="scrim"></div>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <header id="sheet-head" class="sheet-head">
        <h2 id="sheet-title" class="sheet-title"></h2>
      </header>
      <div id="sheet-body" class="sheet-body"></div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
