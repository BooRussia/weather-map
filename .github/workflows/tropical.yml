name: Tropical data

# NHC's storm list and ATCF model files can't be read from a browser (no
# CORS), so this job fetches them every 30 minutes and publishes compact JSON
# to the `data` branch, which the app reads from raw.githubusercontent.com.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tropical-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build tropical.json
        run: node scripts/tropical.mjs out/tropical.json
      - name: Publish to the data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tropical.json
          git commit -q -m "Tropical data $(date -u +%Y-%m-%dT%H:%MZ)"
          # One commit, replaced each run: the branch never grows.
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
